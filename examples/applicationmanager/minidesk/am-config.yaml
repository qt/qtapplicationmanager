%YAML 1.2
---
formatVersion: 1
formatType: am-configuration
---
applications:
  builtinAppsManifestDir: "${EXECUTABLE_DIR}/apps"
  installationDir: "${stdpath:TempLocation}/qtam-example/minidesk/apps"
  documentDir: "${stdpath:TempLocation}/qtam-example/minidesk/docs"

logging:
  rules:
    - "*=false"
    - "qt.*=false"
    - "am.*=false"
    - "qml*=true"
    - "*.warning=true"
    - "*.critical=true"

ui:
  fullscreen: false
  mainQml: "${CONFIG_DIR}/system-ui/main.qml"

systemProperties:
  protected:
    light: true

# development setup:
flags:
  developmentMode: system
  noSecurity: true

watchdog:
  eventloop:
    checkInterval: 1s
    warnTimeout: 1s
    killTimeout: 10s
  quickwindow:
    checkInterval: 2s
    warnTimeout: 35ms
    killTimeout: 10s
  wayland:
    checkInterval: 5s
    warnTimeout: 1s
    killTimeout: 10s

