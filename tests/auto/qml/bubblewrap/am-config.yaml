formatVersion: 1
formatType: am-configuration
---
applications:
  builtinAppsManifestDir: "${CONFIG_DIR}/apps"
  extraDirs:
    testdata: /tmp/qt-am-bwrap-rw-test

runtimes:
  qml:
    quitTime: 10000  # coin can be VERY slow
    importPaths: [ '${CONFIG_DIR}/apps/helper' ]

flags:
  developmentMode: true

containers:
  selection:
    - "TestApp":        "bubblewrap"
    - "TestAppWithCap": "bubblewrap"

  bubblewrap:
    sharedNamespaces: [ '-all', '+net' ]
    networkSetupScript: ${CONFIG_DIR}/netscript.sh
    environmentFiles: [ '${CONFIG_DIR}/good.env', '${CONFIG_DIR}/bad.env' ]

    # set to true, if you build against a system or Installer Qt and the launcher cannot be found
    bindMountHome: true
    customBindMounts:
      app: '/custom-app'
      extra:
        '${CONFIG_DIR}/mount-test-data/ro-source':
          path: '/bwrap-ro-mount'
          mode: ro
        '${CONFIG_DIR}/mount-test-data/${APPLICATION_ID}':
          path: '/bwrap-appid-mount'
          mode: ro
        /tmp/qt-am-bwrap-rw-test:
          path: '/bwrap-rw-mount'
          mode: rw
        '${CONFIG_DIR}/mount-test-data/cap-source':
          path: '/bwrap-cap-mount'
          mode: ro
          capabilities: [ special-cap ]
    configuration:
    - symlink:
        usr/bin: [ '/bin', '/sbin' ]
    - ro-bind:
        /lib: '/lib'
        /usr/bin: '/usr/bin'
        /usr/lib: '/usr/lib'
        /etc: '/etc'
        /usr/share/fonts: '/usr/share/fonts'
        /usr/share/fontconfig: '/usr/share/fontconfig'
        /sys/dev/char: '/sys/dev/char'
    - ro-bind-try:
        /lib64: '/lib64'
        /usr/lib64: '/usr/lib64'
        /usr/local/lib: '/usr/local/lib'
        /usr/local/lib64: '/usr/local/lib64'
        '/sys/devices/pci0000:00': '/sys/devices/pci0000:00'
        /usr/share/glvnd/egl_vendor.d: '/usr/share/glvnd/egl_vendor.d'
        /usr/share/ca-certificates: '/usr/share/ca-certificates'
        /usr/share/X11/xkb: '/usr/share/X11/xkb'
        /run/resolvconf: '/run/resolvconf'
    - dev: '/dev'
    - dev-bind:
        /dev/dri: '/dev/dri'
    - tmpfs:
        /tmp
    - proc:
        /proc
    - unsetenv: [ TESTING1, TESTING2 ]
