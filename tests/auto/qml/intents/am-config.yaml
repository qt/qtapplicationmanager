formatVersion: 1
formatType: am-configuration
---
applications:
  builtinAppsManifestDir: "${CONFIG_DIR}/apps"

ui:
  fullscreen: false

flags:
  noSecurity: true
  noUiWatchdog: true

runtimes:
  qml:
    quitTime: 3000

intents:
  timeouts:
    # kept low so the timeout-path tests (disambiguation/start-application timeouts) don't wait
    # long; the runtime scales these by timeoutFactor() for slow CI machines
    disambiguation: 300
    startApplication: 300
    replyFromApplication: 1000
    replyFromSystem: 2000
