formatVersion: 1
formatType: am-configuration
---
applications:
  builtinAppsManifestDir: "${CONFIG_DIR}/apps"

runtimes:
  qml:
    importPaths: [ 'apps/slowanimhelper' ]

# the slow-animations test loads the helper module in the System UI too, to check the System-UI
# side of the slowAnimations machinery (the app side is checked via the runtime importPaths above)
ui:
  importPaths: [ '${CONFIG_DIR}/apps/slowanimhelper' ]
